name: Scorecard

# Its own workflow rather than a job in security.yml, because the triggers are not the same: scorecard-action
# supports push to the default branch and schedule, and treats pull_request as experimental with no support
# for forks. Folding it into security.yml — which runs on every pull request — would run it where it is not
# supported and report scores for a ref nobody is releasing. (Plan task 54, T14.)
on:
  # Re-scores when someone changes branch protection, which is one of the checks.
  branch_protection_rule:
  schedule:
    - cron: '41 6 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Supply-chain scorecard
    runs-on: ubuntu-latest
    permissions:
      # Publishes the findings to the Security tab as code-scanning alerts.
      security-events: write
      # The OIDC token that publish_results uses to prove the results came from this repository.
      id-token: write
      contents: read
      # Scorecard reads workflow run history for some of its checks.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Scorecard's own Token-Permissions check wants no credentials left in the checkout, and nothing
          # here needs to push.
          persist-credentials: false

      - id: scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score so the README badge and api.scorecard.dev can read it. This is a deliberate
          # disclosure: the score, and which checks fail, become public for anyone who looks. That is the
          # point of putting the badge on a public repository — a badge nobody can verify is decoration.
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      # Into the Security tab, so a failing check is a finding to triage rather than a number to admire.
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: results.sarif
