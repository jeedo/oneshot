name: Release

# A push to main is the trigger, and branch protection is what makes that safe: every CI job (ci.yml) and
# every security job (security.yml) is a required check, so a commit only reaches main having passed all of
# them on its pull request. Re-running those gates here would double the cost to re-prove something already
# proven — what this workflow adds is the tag, the signed image, and the SBOM. See docs/deployment.md for the
# exact branch-protection settings this assumes, and plan task 53.
on:
  push:
    branches: [main]
  # A release that should have been cut and was not — a workflow outage, a token expiry — can be retried
  # without an empty commit. semantic-release is idempotent: with no new releasable commits it does nothing.
  workflow_dispatch:

# Read-only by default. Every write scope below is granted to the single job that needs it, the same way
# security.yml scopes security-events: write to CodeQL alone; ReleaseWorkflowTests fails the build if a write
# scope appears at this level, where it would apply to every job anyone adds later.
permissions:
  contents: read

concurrency:
  # Never cancel a release in flight: a half-finished one leaves a tag with no image behind it.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  release:
    name: Version and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      # Creating the tag and the release. Not a branch write: no plugin here pushes a commit (.releaserc.yml).
      contents: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # commit-analyzer works out the bump from the commits since the last tag, so it needs them all.
          fetch-depth: 0

      - id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say what happened
        run: |
          if [ "${{ steps.semantic.outputs.new_release_published }}" = "true" ]; then
            echo "released ${{ steps.semantic.outputs.new_release_version }}"
          else
            echo "no releasable commits since the last tag; nothing to publish"
          fi

  image:
    name: Sign and publish the image
    needs: release
    # Only when a version was actually cut. A docs-only push to main is release-silent under Conventional
    # Commits, and publishing an image for a release that does not exist would be worse than publishing none.
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Pushing the image to GHCR.
      packages: write
      # Attaching the SBOM to the release created above.
      contents: write
      # The OIDC token cosign exchanges for a short-lived certificate. This is what makes signing keyless:
      # there is no private key in this repository to steal, and the signature is bound to this workflow's
      # identity rather than to whoever holds a file.
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Warms the local image cache before the real build, retried, so a transient registry outage does not
      # turn into a tag and GitHub Release with no image behind them — semantic-release has already published
      # both by the time this job runs. No setup-buildx-action step means build-push-action below uses the
      # "docker" driver, which shares this cache; a pull here is a pull the build below does not need to
      # repeat (issue #66, security review F1). Read straight from the Containerfile so this can never drift
      # from what it actually pins.
      - name: Pull base images (retried)
        run: |
          set -euo pipefail
          mapfile -t images < <(grep -oP '(?<=^FROM )\S+' Containerfile)
          for image in "${images[@]}"; do
            attempt=0
            until docker pull "$image"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "failed to pull $image after 3 attempts"; exit 1
              fi
              echo "pull attempt $attempt of $image failed; retrying"
              sleep $((attempt * 5))
            done
          done

      # The same Containerfile the security workflow builds and scans on every pull request, so what ships is
      # the artefact those gates were run against.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signing the digest, not a tag: a tag can be repointed at different bytes later, and a signature over
      # a tag would then vouch for something nobody reviewed. The digest names the artefact itself.
      #
      # Retried: Fulcio is a third-party network dependency of a keyless signature, just like the registry is
      # for the pull above (issue #66, security review F1) — a transient connection reset should not leave a
      # pushed, unsigned image behind. Not theoretical: the first real release (v1.1.0) hit exactly this
      # failure mode signing the SBOM below and needed a manual re-run to recover.
      - name: Sign the image
        run: |
          set -euo pipefail
          attempt=0
          until cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "cosign sign failed after 3 attempts"; exit 1
            fi
            echo "sign attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done

      # Built from the pushed image rather than the source tree, so it lists what actually shipped.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # A cosign signature over the SBOM itself, not just the image: OpenSSF Scorecard's Signed-Releases check
      # (issue #71) looks at what is attached to the GitHub Release, which is a different artifact from the
      # image in GHCR — signing the image alone leaves the release itself unsigned. --bundle is required as of
      # cosign v3 and writes the standardized Sigstore bundle format, which is what *.sigstore.json names.
      # Retried for the same reason as "Sign the image" above — this exact step is what actually failed on
      # v1.1.0's release ("read tcp ...: connection reset by peer" talking to fulcio.sigstore.dev).
      - name: Sign the SBOM
        run: |
          set -euo pipefail
          attempt=0
          until cosign sign-blob --yes --bundle sbom.spdx.json.sigstore.json sbom.spdx.json; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "cosign sign-blob failed after 3 attempts"; exit 1
            fi
            echo "sign attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done

      # Attached here rather than through semantic-release's assets: the SBOM describes an image that could
      # not exist until the release had been cut and the version named.
      - name: Attach the SBOM and its signature to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${VERSION}" sbom.spdx.json sbom.spdx.json.sigstore.json --clobber

      - name: Record what was published
        run: |
          {
            echo "### Published"
            echo
            echo "- image: \`${IMAGE}:${VERSION}\`"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- signature: keyless, via this workflow's OIDC identity"
            echo "- SBOM: attached to release \`v${VERSION}\` as \`sbom.spdx.json\`, signed as \`sbom.spdx.json.sigstore.json\`"
            echo
            echo "Verify the image with:"
            echo '```'
            echo "cosign verify ${IMAGE}@${{ steps.push.outputs.digest }} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Verify the SBOM with:"
            echo '```'
            echo "cosign verify-blob --bundle sbom.spdx.json.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  sbom.spdx.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
